# Print the ship's two documents and publish them as release assets.
#
# The PDFs are build output, not tree content: the two chapter catalogs are the
# source of truth (see CLAUDE.md), so a committed PDF would be a third in-tree
# copy of every figure in them. A release asset keeps them off the tree while
# still giving each one a permanent public link:
#
#   https://github.com/chandlercv/simpit-game/releases/latest/download/pilots-manual.pdf
#   https://github.com/chandlercv/simpit-game/releases/latest/download/terminal-procedures.pdf
#
# Push a `v*` tag to publish. Every pull request builds the same two PDFs and
# attaches them to the run instead of to a release, which is how a change to
# either catalog gets proofed on paper before it merges.
#
# NOTE: `workflow_dispatch` -- the Actions -> Manuals -> Run workflow button --
# only appears once this file is on the default branch. That is a GitHub rule
# about where it looks for dispatchable workflows, not a property of this file,
# and it is why the `pull_request` trigger below is what proves the workflow
# before the first merge. Tag pushes are unaffected: a `push` event runs the
# workflow as it exists at the pushed ref.

name: Manuals

on:
  push:
    tags:
      - 'v*'
  # Unfiltered on purpose. Both documents quote figures from all over the tree
  # and resolve their control names through the live Input Map, so a paths
  # filter narrow enough to be worth having would be wrong often enough to skip
  # a proof that mattered.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # gh release create / upload

env:
  # Bump these together, and keep them on the editor the project is built with
  # (project.godot, config/features -> "4.7").
  GODOT_VERSION: 4.7-stable
  GODOT_ZIP: Godot_v4.7-stable_win64.exe.zip

jobs:
  manuals:
    # Windows is required, not merely convenient. addons/hid declares a single
    # library -- windows.x86_64 -- and the only binary committed for it is the
    # Windows DLL, so the project's autoloads cannot load anywhere else. It also
    # means build_manuals.ps1 finds Chrome or Edge at the install paths it looks
    # in, and that CI takes the same code path a contributor takes locally.
    runs-on: windows-latest
    # A cold print is about four minutes. The ceiling is here because the
    # failure mode of this job is a hang, not a crash: anything that stops
    # ManualExport reaching its quit leaves headless Godot spinning, and the
    # 6-hour default would let it.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}/${env:GODOT_ZIP}"
          Invoke-WebRequest $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-bin

          # Both binaries go in one directory under exactly these names:
          # build_manuals.ps1 looks for `godot_console` first and `godot` second,
          # and the console wrapper launches its sibling by stripping `_console`
          # from its own filename, so the pair has to stay together and matched.
          #
          # The console build is required, not preferred -- see the import step.
          $dir = (Resolve-Path godot-bin).Path
          $console = Get-ChildItem $dir -Filter '*_console.exe' | Select-Object -First 1
          $gui = Get-ChildItem $dir -Filter '*.exe' |
              Where-Object { $_.Name -notlike '*_console.exe' } | Select-Object -First 1
          if (-not $gui) { throw "no Godot executable unpacked into $dir" }
          if (-not $console) { throw "no Godot console executable unpacked into $dir" }
          Move-Item $gui.FullName (Join-Path $dir 'godot.exe')
          Move-Item $console.FullName (Join-Path $dir 'godot_console.exe')

          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'godot_console.exe') --headless --version

      - name: Import project resources
        shell: pwsh
        run: |
          # .godot/ is gitignored, so a fresh checkout has never imported the
          # project. What that costs is not just the fonts and scenes: the import
          # is also what writes .godot/global_script_class_cache.cfg, and without
          # it no `class_name` global resolves. GameState then fails to parse,
          # every autoload reading it sees Nil and throws once per frame, and
          # ManualExport never reaches its quit -- so the run HANGS rather than
          # failing, which is what the job timeout above is for.
          #
          # It must be godot_console. The plain godot.exe is a GUI-subsystem
          # binary that detaches and returns in about 20 ms, so the step looks
          # clean having imported nothing at all -- measured, not guessed.
          # build_manuals.ps1 documents this same trap and picks the console
          # build for the same reason.
          $PSNativeCommandUseErrorActionPreference = $false
          godot_console --headless --path . --import

          # Judge the import by what it produced rather than by its exit code,
          # the way build_manuals.ps1 judges its own stages. This is the check
          # that would have caught the silent no-op above.
          if (-not (Test-Path .godot/global_script_class_cache.cfg)) {
            throw "no global script class cache after import -- class_name globals will not resolve"
          }
          exit 0

      - name: Print both documents
        shell: pwsh
        timeout-minutes: 10
        run: |
          # build_manuals.ps1 deliberately judges each stage by the file it
          # produced rather than by an exit code -- neither the GUI-subsystem
          # Godot build nor headless Chrome reports one reliably. Turn off
          # PowerShell 7.4's native-command error mapping so a stray exit code
          # cannot pre-empt those checks.
          $PSNativeCommandUseErrorActionPreference = $false
          ./tools/build_manuals.ps1

          $pdfs = @(Get-ChildItem build/manuals -Filter *.pdf)
          if ($pdfs.Count -lt 2) { throw "expected two PDFs, got $($pdfs.Count)" }
          $pdfs | ForEach-Object { '{0}  {1:N0} bytes' -f $_.Name, $_.Length }
          exit 0

      - name: Attach the PDFs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failing `gh release view` is the ordinary path for a fresh tag, so
          # don't let PowerShell turn that exit code into a terminating error.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $pdfs = @(Get-ChildItem build/manuals -Filter *.pdf).FullName

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $pdfs --clobber
          } else {
            gh release create $tag $pdfs --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh exited $LASTEXITCODE" }

      - name: Upload the PDFs as a run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: manuals
          path: build/manuals/*.pdf
          if-no-files-found: error
